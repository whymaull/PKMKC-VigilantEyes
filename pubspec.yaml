name: vigilanteyes
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  firebase_analytics: ^11.1.0
  firebase_auth: ^5.1.0
  firebase_core: ^3.1.0
  firebase_in_app_messaging: ^0.8.0+2
  firebase_messaging: ^15.0.2
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_svg: ^2.0.10+1
  get: 4.6.6
  http: ^1.2.1
  intl: ^0.19.0
  onesignal_flutter: ^5.2.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
